# Conventional Commits 配置文件
# 用于 commitlint 工具的验证规则

extends:
  - '@commitlint/config-conventional'

# 提交类型枚举
rules:
  # 类型必须是以下之一
  type-enum:
    - 2
    - always
    - feat       # 新功能
    - fix        # Bug修复
    - docs       # 文档更新
    - style      # 代码格式（不影响功能）
    - refactor   # 重构（既不是新功能也不是修复）
    - perf       # 性能优化
    - test       # 测试相关
    - chore      # 构建/工具链相关
    - ci         # CI/CD配置
    - revert     # 回滚之前的提交

  # 作用域枚举
  scope-enum:
    - 2
    - always
    - kernel     # 内核核心
    - scheduler  # 调度器
    - mm         # 内存管理
    - ipc        # 进程间通信
    - fs         # 文件系统
    - driver     # 设备驱动
    - arch       # 架构相关代码
    - crypto     # 加密/签名
    - build      # 构建系统
    - config     # 配置系统

  # 类型必须小写
  type-case:
    - 2
    - always
    - lower-case

  # 作用域必须小写
  scope-case:
    - 2
    - always
    - lower-case

  # 主题行必须小写开头
  subject-case:
    - 2
    - always
    - lower-case

  # 主题行最大长度
  subject-max-length:
    - 2
    - always
    - 72

  # 主题行最小长度
  subject-min-length:
    - 2
    - always
    - 10

  # 主题行不能以句号结尾
  subject-empty:
    - 2
    - always

  # 主题行不能以句号结尾
  subject-full-stop:
    - 2
    - always
    - false

  # 正文每行最大长度
  body-max-line-length:
    - 2
    - always
    - 72

  # 页脚每行最大长度
  footer-max-line-length:
    - 2
    - always
    - 72

# 提示信息
prompt:
  messages:
    type: 选择你提交的类型:
    scope: 选择一个提交范围 (可选):
    subject: 写一个简短的描述:
    body: 写一个详细的描述 (可选). 使用 "|" 换行:
    breaking: 是否有破坏性变更? 选择 "yes" 如果有:
    footer: 关联的issue (例如. "fixes #123", "refs #456") (可选):
